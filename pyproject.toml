[project]
name = "surplus"
version = "0.1.0"
description = "Puts the unused capacity of your AI subscriptions to work on your own side projects."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.9",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "typer>=0.15",
  "structlog>=24.4",
  "numpy>=2.1",
  "watchfiles>=1.0",
  "jinja2>=3.1.6",
]

[dependency-groups]
dev = [
  "ruff>=0.8",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "hypothesis>=6.120",
  "httpx>=0.28",
]

[project.scripts]
surplus = "surplus.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
dev-mode-dirs = ["backend"]

[tool.hatch.build.targets.wheel]
packages = ["backend/surplus"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "SIM", "RUF", "PT", "TID", "DTZ"]
ignore = ["S101", "S603", "S607", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["S", "DTZ001", "PT018", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["surplus"]
known-local-folder = ["conftest"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "backend"
packages = ["surplus"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q -m 'not podman and not quota'"
markers = [
  "podman: needs rootless Podman and the runner image; no Claude quota (`make redteam`)",
  "quota: drives a real Claude agent and spends a little subscription quota (`make redteam-agent`)",
]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
